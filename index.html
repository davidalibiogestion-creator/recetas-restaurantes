<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio de Recetas - Grupo de Restaurantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
            .page-break { page-break-before: always; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- URL DE LA API DE GOOGLE -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyCscVqzfma7EW6JVXKCHYpjypZZTvKHrXOIQcF1wvAHWYKImFJhhbkc2YS9iMt0vPqBg/exec";
    </script>

    <!-- CABECERA -->
    <header class="bg-slate-900 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid text-amber-500 text-2xl fa-utensils"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Repositorio de Recetas</h1>
                    <p class="text-xs text-slate-400">Grupo de Restaurantes</p>
                </div>
            </div>
            <div id="userStatus" class="flex items-center space-x-4 text-sm"></div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- LOGIN -->
        <div id="loginView" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-200 mt-10 no-print">
            <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Acceso al Sistema</h2>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
                    <input type="text" id="loginUsername" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-lg transition">Iniciar Sesión</button>
            </form>
            <div class="mt-6 p-4 bg-slate-50 rounded-lg text-xs text-slate-600 space-y-1 border">
                <p class="font-bold">Credenciales de prueba:</p>
                <p>• <b>SuperAdmin:</b> superadmin / admin123</p>
                <p>• <b>Chef / Editor:</b> chef_ason / chef123</p>
                <p>• <b>Cocinero:</b> cocinero_nm / cocinero123</p>
            </div>
        </div>

        <!-- PANEL PRINCIPAL -->
        <div id="appView" class="hidden space-y-6">
            
            <!-- FILTROS Y BOTÓN NUEVA RECETA -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 justify-between items-center no-print">
                <div class="flex flex-wrap gap-3 flex-1 min-w-[300px]">
                    <input type="text" id="searchInput" oninput="renderRecipes()" placeholder="Buscar receta o ingrediente..." class="px-3 py-2 border rounded-lg text-sm w-full sm:w-64 outline-none focus:ring-2 focus:ring-amber-500">
                    <select id="filterRestaurante" onchange="renderRecipes()" class="px-3 py-2 border rounded-lg text-sm bg-white outline-none">
                        <option value="TODOS">Todos los Restaurantes</option>
                        <option value="Sidreria del Asón">Sidreria del Asón</option>
                        <option value="Nuevo Mundo">Nuevo Mundo</option>
                        <option value="Cascarilla">Cascarilla</option>
                        <option value="Pruebas I+D">Pruebas I+D</option>
                    </select>
                    <select id="filterCategoria" onchange="renderRecipes()" class="px-3 py-2 border rounded-lg text-sm bg-white outline-none">
                        <option value="TODAS">Todas las Categorías</option>
                        <option value="Elaboración">Elaboración</option>
                        <option value="Entrantes">Entrantes</option>
                        <option value="Segundos">Segundos</option>
                        <option value="Postres">Postres</option>
                        <option value="Menú primeros">Menú primeros</option>
                        <option value="Menú segundos">Menú segundos</option>
                    </select>
                </div>
                <div id="actionButtons" class="flex items-center space-x-2"></div>
            </div>

            <!-- GRID RECETAS -->
            <div id="recipesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 no-print"></div>

            <!-- MODAL VER RECETA / PDF -->
            <div id="recipeDetailModal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 overflow-y-auto">
                <div class="bg-white rounded-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-6 relative shadow-2xl">
                    <button onclick="closeModal()" class="no-print absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                    <div id="detailContent"></div>
                </div>
            </div>

            <!-- MODAL CREAR / EDITAR RECETA -->
            <div id="recipeEditModal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 overflow-y-auto">
                <div class="bg-white rounded-xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6 space-y-4 relative shadow-2xl">
                    <button onclick="closeEditModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                    <h2 id="modalFormTitle" class="text-xl font-bold text-slate-800 border-b pb-2">Crear Receta</h2>
                    
                    <form id="recipeForm" onsubmit="handleSaveRecipe(event)" class="space-y-4 text-sm">
                        <input type="hidden" id="formRecipeId">
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block font-medium mb-1">Nombre de la Receta</label>
                                <input type="text" id="formNombre" required class="w-full px-3 py-2 border rounded-lg">
                            </div>
                            <div>
                                <label class="block font-medium mb-1">Categoría</label>
                                <select id="formCategoria" class="w-full px-3 py-2 border rounded-lg bg-white">
                                    <option value="Elaboración">Elaboración</option>
                                    <option value="Entrantes">Entrantes</option>
                                    <option value="Segundos">Segundos</option>
                                    <option value="Postres">Postres</option>
                                    <option value="Menú primeros">Menú primeros</option>
                                    <option value="Menú segundos">Menú segundos</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="block font-medium mb-1">Cód. Cuiner</label>
                                <input type="text" id="formCodCuiner" class="w-full px-3 py-2 border rounded-lg">
                            </div>
                            <div>
                                <label class="block font-medium mb-1">Raciones</label>
                                <input type="number" id="formRaciones" value="1" min="1" class="w-full px-3 py-2 border rounded-lg">
                            </div>
                            <div>
                                <label class="block font-medium mb-1">Rendimiento</label>
                                <input type="text" id="formRendimiento" placeholder="Ej: 100%" class="w-full px-3 py-2 border rounded-lg">
                            </div>
                        </div>

                        <div>
                            <label class="block font-medium mb-1">Restaurantes Asignados</label>
                            <div class="flex flex-wrap gap-3">
                                <label class="flex items-center gap-1"><input type="checkbox" name="formRestaurantes" value="Sidreria del Asón"> Sidreria del Asón</label>
                                <label class="flex items-center gap-1"><input type="checkbox" name="formRestaurantes" value="Nuevo Mundo"> Nuevo Mundo</label>
                                <label class="flex items-center gap-1"><input type="checkbox" name="formRestaurantes" value="Cascarilla"> Cascarilla</label>
                                <label class="flex items-center gap-1"><input type="checkbox" name="formRestaurantes" value="Pruebas I+D"> Pruebas I+D</label>
                            </div>
                        </div>

                        <div>
                            <label class="block font-medium mb-1">Materiales / Utillaje</label>
                            <input type="text" id="formMaterial" placeholder="Ej: Sartén Nº24, Pinzas..." class="w-full px-3 py-2 border rounded-lg">
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="font-medium">Elaboración (Pasos secuenciales)</label>
                                <button type="button" onclick="startVoiceRecognition()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs px-2 py-1 rounded flex items-center gap-1 font-semibold">
                                    <i class="fa-solid fa-microphone text-amber-600"></i> Dictar por voz
                                </button>
                            </div>
                            <textarea id="formElaboracion" rows="4" required class="w-full px-3 py-2 border rounded-lg font-sans"></textarea>
                        </div>

                        <div>
                            <label class="block font-medium mb-1">Puntos Críticos</label>
                            <input type="text" id="formPuntosCriticos" placeholder="Advertencias de seguridad alimentaria o cocción" class="w-full px-3 py-2 border rounded-lg">
                        </div>

                        <!-- FOTO DEL EMPLATADO CON ADJUNTO Y CÁMARA -->
                        <div>
                            <label class="block font-medium mb-1">Foto del Emplatado</label>
                            <div class="space-y-2">
                                <div class="flex items-center gap-2">
                                    <input type="file" id="formFileInput" accept="image/*" capture="environment" onchange="handleImageFileSelect(event)" class="hidden">
                                    <button type="button" onclick="document.getElementById('formFileInput').click()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-2 rounded-lg font-semibold flex items-center gap-2">
                                        <i class="fa-solid fa-camera"></i> Adjuntar o hacer foto
                                    </button>
                                    <span id="fileNameDisplay" class="text-xs text-slate-500 italic">No se ha seleccionado imagen</span>
                                </div>
                                <input type="url" id="formImagenUrl" placeholder="O pega un enlace de imagen (https://...)" class="w-full px-3 py-2 border rounded-lg text-xs">
                                <div id="imagePreviewContainer" class="hidden mt-2">
                                    <img id="imagePreview" class="h-24 rounded border object-cover">
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-end gap-2 pt-2 border-t">
                            <button type="button" onclick="closeEditModal()" class="px-4 py-2 border rounded-lg hover:bg-slate-100">Cancelar</button>
                            <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2 rounded-lg">Guardar Receta</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <!-- CÓDIGO JS -->
    <script>
        let currentUser = null;
        let recipes = [];
        let users = [
            { username: "superadmin", password: "admin123", nombre: "Super Administrador", rol: "superadmin" },
            { username: "chef_ason", password: "chef123", nombre: "Chef Sidrería del Asón", rol: "editor" },
            { username: "cocinero_nm", password: "cocinero123", nombre: "Cocinero Nuevo Mundo", rol: "consulta" }
        ];

        async function initApp() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                if (data.recipes) recipes = data.recipes;
            } catch (e) {
                console.log("Servicio remoto cargado.");
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById("loginUsername").value;
            const p = document.getElementById("loginPassword").value;
            const found = users.find(x => x.username === u && x.password === p);
            if (found) {
                currentUser = found;
                document.getElementById("loginView").classList.add("hidden");
                document.getElementById("appView").classList.remove("hidden");
                renderHeader();
                renderRecipes();
            } else {
                alert("Usuario o contraseña incorrectos.");
            }
        }

        function renderHeader() {
            const container = document.getElementById("userStatus");
            container.innerHTML = `
                <div class="text-right">
                    <div class="font-bold">${currentUser.nombre}</div>
                    <div class="text-xs text-amber-400 capitalize">${currentUser.rol}</div>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-right-from-bracket"></i></button>
            `;

            const btnContainer = document.getElementById("actionButtons");
            if (currentUser.rol !== 'consulta') {
                btnContainer.innerHTML = `<button onclick="openRecipeForm()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2 rounded-lg text-sm"><i class="fa-solid fa-plus mr-2"></i>Nueva Receta</button>`;
            } else {
                btnContainer.innerHTML = '';
            }
        }

        function renderRecipes() {
            const grid = document.getElementById("recipesGrid");
            const search = document.getElementById("searchInput").value.toLowerCase();
            const rest = document.getElementById("filterRestaurante").value;
            const cat = document.getElementById("filterCategoria").value;

            const filtered = recipes.filter(r => {
                const matchSearch = r.nombre.toLowerCase().includes(search);
                const matchRest = rest === 'TODOS' || r.restaurantes.includes(rest);
                const matchCat = cat === 'TODAS' || r.categoria === cat;
                return matchSearch && matchRest && matchCat;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No hay recetas guardadas todavía. ¡Haz clic en "+ Nueva Receta" para crear la primera!</div>`;
                return;
            }

            grid.innerHTML = filtered.map(r => `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition">
                    <div class="h-40 bg-slate-200 relative">
                        <img src="${r.imagenUrl || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=600&q=80'}" class="w-full h-full object-cover">
                        <span class="absolute top-2 right-2 bg-slate-900/80 text-white text-xs px-2 py-1 rounded-md">${r.categoria}</span>
                    </div>
                    <div class="p-4 space-y-3">
                        <h3 class="font-bold text-slate-800 text-base line-clamp-1">${r.nombre}</h3>
                        <div class="flex flex-wrap gap-1">
                            ${r.restaurantes.map(rest => `<span class="bg-amber-100 text-amber-800 text-[10px] font-semibold px-2 py-0.5 rounded">${rest}</span>`).join('')}
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button onclick="viewDetail('${r.id}')" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white text-xs py-2 rounded font-medium">Ver Ficha</button>
                            ${currentUser.rol !== 'consulta' ? `
                                <button onclick="openRecipeForm('${r.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded text-xs"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteRecipe('${r.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded text-xs font-bold"><i class="fa-solid fa-trash"></i></button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function handleImageFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileNameDisplay').innerText = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Data = e.target.result;
                    document.getElementById('formImagenUrl').value = base64Data;
                    document.getElementById('imagePreview').src = base64Data;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function openRecipeForm(id = null) {
            const modal = document.getElementById("recipeEditModal");
            const title = document.getElementById("modalFormTitle");
            
            if (id) {
                const r = recipes.find(x => x.id === id);
                if (!r) return;
                title.innerText = "Editar Receta: " + r.nombre;
                document.getElementById("formRecipeId").value = r.id;
                document.getElementById("formNombre").value = r.nombre;
                document.getElementById("formCategoria").value = r.categoria;
                document.getElementById("formCodCuiner").value = r.codCuiner || "";
                document.getElementById("formRaciones").value = r.raciones || 1;
                document.getElementById("formRendimiento").value = r.rendimiento || "";
                document.getElementById("formMaterial").value = r.material || "";
                document.getElementById("formElaboracion").value = r.elaboracion || "";
                document.getElementById("formPuntosCriticos").value = r.puntosCriticos || "";
                document.getElementById("formImagenUrl").value = r.imagenUrl || "";
                
                if (r.imagenUrl) {
                    document.getElementById('imagePreview').src = r.imagenUrl;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                }

                document.querySelectorAll('input[name="formRestaurantes"]').forEach(cb => {
                    cb.checked = r.restaurantes.includes(cb.value);
                });
            } else {
                title.innerText = "Nueva Receta";
                document.getElementById("recipeForm").reset();
                document.getElementById("formRecipeId").value = "";
                document.getElementById('imagePreviewContainer').classList.add('hidden');
                document.getElementById('fileNameDisplay').innerText = "No se ha seleccionado imagen";
            }

            modal.classList.remove("hidden");
        }

        function closeEditModal() {
            document.getElementById("recipeEditModal").classList.add("hidden");
        }

        async function handleSaveRecipe(e) {
            e.preventDefault();
            const id = document.getElementById("formRecipeId").value || ("REC-" + Math.floor(Math.random() * 90000 + 10000));
            const selectedRest = Array.from(document.querySelectorAll('input[name="formRestaurantes"]:checked')).map(cb => cb.value);

            const recipeObj = {
                id: id,
                nombre: document.getElementById("formNombre").value,
                categoria: document.getElementById("formCategoria").value,
                codCuiner: document.getElementById("formCodCuiner").value,
                raciones: Number(document.getElementById("formRaciones").value),
                rendimiento: document.getElementById("formRendimiento").value,
                restaurantes: selectedRest.length ? selectedRest : ["Pruebas I+D"],
                material: document.getElementById("formMaterial").value,
                elaboracion: document.getElementById("formElaboracion").value,
                puntosCriticos: document.getElementById("formPuntosCriticos").value,
                imagenUrl: document.getElementById("formImagenUrl").value,
                ingredientes: [],
                alergenos: [],
                fecha: new Date().toISOString().split('T')[0]
            };

            const index = recipes.findIndex(x => x.id === id);
            if (index !== -1) {
                recipes[index] = recipeObj;
            } else {
                recipes.push(recipeObj);
            }

            renderRecipes();
            closeEditModal();

            try {
                await fetch(API_URL, {
                    method: "POST",
                    redirect: "follow",
                    body: JSON.stringify({ action: "SAVE_RECIPE", recipe: recipeObj })
                });
            } catch (err) {
                console.log("Guardado local.");
            }
        }

        function startVoiceRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("El dictado por voz requiere Google Chrome.");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.start();

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                const field = document.getElementById("formElaboracion");
                field.value = field.value ? field.value + " " + text : text;
            };
        }

        async function deleteRecipe(id) {
            const r = recipes.find(x => x.id === id);
            if (!r) return;
            
            if (confirm(`¿Eliminar la receta "${r.nombre}"?`)) {
                recipes = recipes.filter(x => x.id !== id);
                renderRecipes();

                try {
                    await fetch(API_URL, {
                        method: "POST",
                        redirect: "follow",
                        body: JSON.stringify({ action: "DELETE_RECIPE", id: id })
                    });
                } catch (e) {
                    console.log("Acción enviada.");
                }
            }
        }

        function viewDetail(id) {
            const r = recipes.find(x => x.id === id);
            if (!r) return;
            const modal = document.getElementById("recipeDetailModal");
            const content = document.getElementById("detailContent");
            
            content.innerHTML = `
                <div class="flex justify-between items-start border-b pb-4 no-print">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900">${r.nombre}</h2>
                        <p class="text-xs text-slate-500">Cód Cuiner: ${r.codCuiner || 'N/A'} | Raciones: ${r.raciones}</p>
                    </div>
                    <button onclick="window.print()" class="bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-bold"><i class="fa-solid fa-print"></i> PDF</button>
                </div>
                <div class="space-y-4 pt-2 text-xs">
                    <p><b>Restaurantes:</b> ${r.restaurantes.join(', ')}</p>
                    <p><b>Elaboración:</b></p>
                    <p class="whitespace-pre-line bg-slate-50 p-3 rounded border">${r.elaboracion}</p>
                    ${r.imagenUrl ? `<img src="${r.imagenUrl}" class="max-h-80 rounded border object-cover">` : ''}
                </div>
            `;
            modal.classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("recipeDetailModal").classList.add("hidden");
        }

        function logout() {
            currentUser = null;
            document.getElementById("appView").classList.add("hidden");
            document.getElementById("loginView").classList.remove("hidden");
        }

        initApp();
    </script>
</body>
</html>
